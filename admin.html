<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ウイングベイウォーキング - 集計</title>
<link rel="stylesheet" href="assets/style.css">
<script src="assets/config.js"></script>
</head>
<body>
<div class="wrap">
  <img src="assets/mascot.png" alt="" class="mascot">
  <h1 class="logo">本日の集計</h1>
  <div class="card">
    <p class="admin-updated" id="updated">読み込み中…</p>
    <div class="admin-grid">
      <div class="admin-stat">
        <div class="num" id="statStarts">-</div>
        <div class="label">開始人数</div>
      </div>
      <div class="admin-stat">
        <div class="num" id="statTurns">-</div>
        <div class="label">折り返し人数</div>
      </div>
      <div class="admin-stat" style="grid-column: span 2;">
        <div class="num" id="statCompletions">-</div>
        <div class="label">達成人数</div>
      </div>
    </div>
    <table class="admin-courses" id="courseTable">
      <thead>
        <tr><th>コース</th><th>達成人数</th></tr>
      </thead>
      <tbody id="courseBody"></tbody>
    </table>
    <button class="admin-refresh" id="refreshBtn">今すぐ更新</button>
  </div>
  <p class="tip" id="statusTip"></p>
</div>
<script>
(function () {
  var params = new URLSearchParams(window.location.search);
  var adminKey = params.get('key') || '';
  var statusTip = document.getElementById('statusTip');

  function render(json) {
    document.getElementById('statStarts').textContent = json.starts;
    document.getElementById('statTurns').textContent = json.turns;
    document.getElementById('statCompletions').textContent = json.completions;

    var body = document.getElementById('courseBody');
    body.innerHTML = '';
    ['A', 'B', 'C'].forEach(function (c) {
      var info = json.courses[c];
      if (!info) return;
      var tr = document.createElement('tr');
      var tdName = document.createElement('td');
      tdName.textContent = info.name;
      var tdCount = document.createElement('td');
      tdCount.textContent = info.count;
      tr.appendChild(tdName);
      tr.appendChild(tdCount);
      body.appendChild(tr);
    });

    var now = new Date();
    document.getElementById('updated').textContent =
      json.today + ' の集計（最終更新 ' + now.toLocaleTimeString('ja-JP') + '）' +
      (json.operationEnabled ? '' : '　※本日は受付休止中');
    statusTip.textContent = '';
  }

  async function load() {
    if (!adminKey) {
      statusTip.textContent = 'URLに管理キー（?key=...）が指定されていません。';
      return;
    }
    try {
      var base = window.WB_CONFIG.APPS_SCRIPT_URL;
      var res = await fetch(base + '?action=adminStats&key=' + encodeURIComponent(adminKey));
      var json = await res.json();
      if (!json.ok) {
        statusTip.textContent = '取得できませんでした：' + (json.reason || '');
        return;
      }
      render(json);
    } catch (e) {
      statusTip.textContent = '通信に失敗しました。電波の良い場所でもう一度お試しください。';
    }
  }

  document.getElementById('refreshBtn').addEventListener('click', load);
  load();
  setInterval(load, 30000);
})();
</script>
</body>
</html>
